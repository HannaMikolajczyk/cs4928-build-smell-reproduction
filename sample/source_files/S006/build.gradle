        mainClass = 'org.slavicmyths.verify.RareRuneOffline'
    }
}

// Opt-in 1.3.4.4 combat regression server; fixtures never enter the production JAR.
if (project.hasProperty('combatRuntimeCheck')) {
    sourceSets { combatCheck { java.srcDir 'tools/combat-fix-tests'; resources.srcDir 'tools/combat-fix-test-resources' } }
    sourceSets.combatCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.combatCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
