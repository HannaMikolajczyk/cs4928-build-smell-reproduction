plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = 'slavicmyths' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com' }
    mavenCentral()
}


neoForge {
    version = project.neo_version
    accessTransformers = files("src/main/resources/META-INF/accesstransformer.cfg")
    runs {
        client { client(); gameDirectory = file('run') }
        server { server(); programArgument '--nogui'; gameDirectory = file('run-server') }
    }
    mods { slavicmyths { sourceSet sourceSets.main } }
}
dependencies {
    // Optional, client-only adapter compiled against the exact pinned API; never bundled/runtime-required.
    compileOnly 'maven.modrinth:xaeros-minimap:Q1tuMQBB' // NeoForge 1.21.1 / 26.5.0, immutable version ID.
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (!project.hasProperty('withoutJei')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.properties([mod_version: mod_version, neo_version: neo_version])
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version, neo_version: neo_version
    }
}
jar { manifest { attributes 'Implementation-Version': project.version } }

// Plain JVM, no NeoForge run configuration and no game/world construction.
if (project.hasProperty('barrelOfflineCheck')) {
    sourceSets { barrelOffline { java.srcDir 'tools/barrel-offline' } }
    sourceSets.barrelOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.barrelOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    tasks.register('verifyFermentationOffline', JavaExec) {
        dependsOn 'barrelOfflineClasses'
        classpath = sourceSets.barrelOffline.runtimeClasspath
        mainClass = 'org.slavicmyths.brewing.FermentationOffline'
    }
}

// Chud city fixtures are opt-in, with a separate smoke world and no production test classes.
if (project.hasProperty('chudCheck')) {
    sourceSets { chudCheck { java.srcDir 'tools/chud-tests'; resources.srcDir 'tools/chud-test-resources' } }
    sourceSets.chudCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.chudCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
    tasks.named('compileChudCheckJava') { dependsOn 'classes' }
    neoForge.mods.slavicmyths.sourceSet(sourceSets.chudCheck)
    neoForge.runs { chudChecks {
        type = 'gameTestServer'
        gameDirectory = file('run-chud-151')
        systemProperty 'neoforge.enabledGameTestNamespaces', (project.hasProperty('abandonedCheck') ? 'slavicmyths_abandoned' : 'slavicmyths_chud') + (project.hasProperty('chudTerrainCheck') ? ',slavicmyths_chud_terrain' : '') + (project.hasProperty('chudFullCheck') ? ',slavicmyths_chud_full' : '') + (project.hasProperty('abandonedTerrainCheck') ? ',slavicmyths_abandoned_terrain' : '') + (project.hasProperty('abandonedFullCheck') ? ',slavicmyths_abandoned_full' : '') + (project.hasProperty('chudRegressionCheck') ? ',slavicmyths_chud' : '') + (project.hasProperty('abandonedFinderCheck') ? ',slavicmyths_abandoned_finder' : '')
        systemProperty 'slavicmyths.chudRoot', project.projectDir.absolutePath
    } }
}

// Weapon 2.0 fixtures are opt-in and never enter the production artifact.
if (project.hasProperty('weaponRuntimeCheck')) {
    sourceSets { weaponCheck { java.srcDir 'tools/weapon-tests'; resources.srcDir 'tools/weapon-test-resources' } }
    sourceSets.weaponCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.weaponCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
    tasks.named('compileWeaponCheckJava') { dependsOn 'classes' }
    neoForge.mods.slavicmyths.sourceSet(sourceSets.weaponCheck)
    neoForge.runs { weaponChecks {
        type = 'gameTestServer'
        gameDirectory = file('run-weapons-1321')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'slavicmyths_weapons'
        systemProperty 'slavicmyths.weaponRestartPhase', project.findProperty('weaponRestartPhase') ?: 'none'
    } }
}

// Class 2.0 fixtures are opt-in and never enter the production artifact.
if (project.hasProperty('classRuntimeCheck')) {
    sourceSets { classCheck { java.srcDir 'tools/class-tests'; resources.srcDir 'tools/class-test-resources' } }
    sourceSets.classCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.classCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
    tasks.named('compileClassCheckJava') { dependsOn 'classes' }
    neoForge.mods.slavicmyths.sourceSet(sourceSets.classCheck)
    neoForge.runs { classChecks {
        type = 'gameTestServer'
        gameDirectory = file('run-classes-131')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'slavicmyths_classes'
        systemProperty 'slavicmyths.classRestartPhase', project.findProperty('classRestartPhase') ?: 'none'
    } }
}

// Opt-in 1.2.1 dedicated-server checks, isolated from the shipped mod and all player worlds.
if (project.hasProperty('villageRuntimeCheck')) {
    sourceSets {
        villageCheck { java.srcDir 'tools/village-tests'; resources.srcDir 'tools/village-test-resources' }
    }
    sourceSets.villageCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.villageCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
    tasks.named('compileVillageCheckJava') { dependsOn 'classes' }
    neoForge.mods.slavicmyths.sourceSet(sourceSets.villageCheck)
    neoForge.runs {
        villageChecks {
            type = 'gameTestServer'
            gameDirectory = file(project.findProperty('villageCheckDirectory') ?: (project.hasProperty('gorodishcheCheck') ? 'run-gorodishche-checks' : project.hasProperty('villageBuildingsCheck') ? 'run-village-buildings-checks' : 'run-village-checks'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('gorodishcheCheck') ? 'slavicmyths_city' : project.hasProperty('villageBuildingsCheck') ? 'slavicmyths_buildings' : 'slavicmyths_village'
            systemProperty 'slavicmyths.settlementRestartPhase', project.findProperty('settlementRestartPhase') ?: 'none'
        }
    }
    tasks.register('verifyVillageGeometry', JavaExec) {
        dependsOn 'villageCheckClasses'
        classpath = sourceSets.villageCheck.runtimeClasspath
        mainClass = 'org.slavicmyths.verify.VillageGeometryCheck'
    }
}
// Verification remains outside production. API migration is tracked in PORT_STATUS.
sourceSets {
    kurganCheck {
        java.srcDir 'tools/kurgan-tests'
        resources.srcDir 'tools/kurgan-test-resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('verifyNavigation', JavaExec) {
    dependsOn 'kurganCheckClasses'
    classpath = sourceSets.kurganCheck.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.NavigationHeadless'
}
// Registry-dependent checks require a real loader. Selecting an alias enables
// the isolated GameTest run; invoking several aliases still runs the server once.
def loaderCheckAliases = ['verifyYaga', 'verifyYagaPlacement', 'verifyPortRecipes', 'verifyPortDamage']
loaderCheckAliases.each { name ->
    tasks.register(name) {
        description = 'Run registry-dependent checks on the isolated headless GameTest server.'
        dependsOn 'runRuntimeChecks'
    }
}

// Intermediate API checks compile these actual independent production modules
// without excluding any sources from the real mod. No replacement/stub classes.
sourceSets {
    portCore {
        java.srcDirs = ['src/main/java', 'tools/kurgan-tests']
        java.include 'org/slavicmyths/kurgan/KurganPlan.java',
                'org/slavicmyths/kurgan/KurganLayout.java',
                'org/slavicmyths/kurgan/KurganPlanNbt.java',
                'org/slavicmyths/kurgan/KurganInstance.java',
                'org/slavicmyths/kurgan/KurganEncounterState.java',
                'org/slavicmyths/kurgan/KurganFighter.java',
                'org/slavicmyths/kurgan/KurganRoster.java',
                'org/slavicmyths/kurgan/BurialRecords.java',
                'org/slavicmyths/hunt/HuntRecords.java',
                'org/slavicmyths/hunt/HuntTarget.java',
                'org/slavicmyths/hunt/BossKind.java',
                'org/slavicmyths/hunt/BossRules.java',
                'org/slavicmyths/hunt/HuntRules.java',
                'org/slavicmyths/hunt/ElementRules.java',
                'org/slavicmyths/hunt/DashFacing.java',
                'org/slavicmyths/rpg/RpgNbt.java',
                'org/slavicmyths/armorer/ArmorerRecipe.java',
                'org/slavicmyths/armorer/ArmorerInput.java',
                'org/slavicmyths/item/ItemState.java',
                'org/slavicmyths/registry/ModEffects.java',
                'org/slavicmyths/registry/ModSounds.java',
                'org/slavicmyths/kurgan/KurganCurse.java',
                'org/slavicmyths/yaga/YagaHutPlan.java',
                'org/slavicmyths/depth/PoolIndex.java',
                'org/slavicmyths/verify/KurganHeadless.java',
                'org/slavicmyths/verify/KurganReworkHeadless.java',
                'org/slavicmyths/verify/HuntHeadless.java',
                'org/slavicmyths/verify/PortDataHeadless.java',
                'org/slavicmyths/verify/PortRecipesHeadless.java',
                'org/slavicmyths/verify/PortComponentsHeadless.java',
                'org/slavicmyths/network/MythPayloads.java',
                'org/slavicmyths/network/ClientPayloadEvents.java',
                'org/slavicmyths/network/LoreNetwork.java',
                'org/slavicmyths/item/ClubItem.java',
                'org/slavicmyths/item/HeavyWeaponItem.java',
                'org/slavicmyths/item/SpearItem.java',
                'org/slavicmyths/item/MythShieldItem.java',
                'org/slavicmyths/item/AncientCoinItem.java',
                'org/slavicmyths/item/AncientSignItem.java',
                'org/slavicmyths/item/AmberCharmItem.java',
                'org/slavicmyths/item/PerunCharmItem.java',
                'org/slavicmyths/item/BerryMorsItem.java',
                'org/slavicmyths/item/SevenLeagueBoots.java',
                'org/slavicmyths/item/ThunderAxeItem.java',
                'org/slavicmyths/combat/MaceItem.java',
                'org/slavicmyths/combat/FlailItem.java',
                'org/slavicmyths/verify/PortPayloadsHeadless.java',
                'org/slavicmyths/client/FolkModelGeometry.java',
                'org/slavicmyths/water/ReedBlock.java',
                'org/slavicmyths/yaga/YagaLegBlock.java',
                'org/slavicmyths/verify/PortGeometryHeadless.java',
                'org/slavicmyths/flight/Tailwind.java',
                'org/slavicmyths/combat/MythDamageSources.java',
                'org/slavicmyths/verify/PortDamageHeadless.java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += configurations.runtimeClasspath
    }
}
['Kurgan', 'Hunt'].each { system ->
    tasks.register("verify${system}", JavaExec) {
        dependsOn 'portCoreClasses'
        classpath = sourceSets.portCore.runtimeClasspath
        mainClass = "org.slavicmyths.verify.${system}Headless"
    }
}
tasks.register('verifyPortData', JavaExec) {
    dependsOn 'portCoreClasses'
    classpath = sourceSets.portCore.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.PortDataHeadless'
    args file('docs/verification/yaga-0.9.3/hut-plan.json').absolutePath
}
tasks.register('verifyPortCore') { dependsOn 'verifyKurgan', 'verifyHunt', 'verifyPortData' }
tasks.register('verifyKurganRework', JavaExec) {
    dependsOn 'portCoreClasses'
    classpath = sourceSets.portCore.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.KurganReworkHeadless'
}

tasks.register('verifyPortComponents', JavaExec) {
    dependsOn 'portCoreClasses'
    classpath = sourceSets.portCore.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.PortComponentsHeadless'
}

tasks.register('verifyPortPayloads', JavaExec) {
    dependsOn 'portCoreClasses'
    classpath = sourceSets.portCore.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.PortPayloadsHeadless'
}

tasks.register('verifyPortGeometry', JavaExec) {
    dependsOn 'portCoreClasses'
    classpath = sourceSets.portCore.runtimeClasspath
    mainClass = 'org.slavicmyths.verify.PortGeometryHeadless'
}

// Loader-backed headless checks share the actual mod in this opt-in run only.
// They never enter the production JAR or the ordinary client/server configurations.
if (project.hasProperty('portRuntimeCheck') || gradle.startParameter.taskNames.any {
    loaderCheckAliases.contains(it.tokenize(':').last())
}) {
    neoForge.mods.slavicmyths.sourceSet(sourceSets.kurganCheck)
    neoForge.runs {
        runtimeChecks {
            type = 'gameTestServer'
            gameDirectory = project.hasProperty('kurganHotfixCheck') ? file('run-kurgan-hotfix') : project.hasProperty('placementOverrideCheck') ? file(project.hasProperty('waterFlatPlacementCheck') ? 'run-placement-priority-water' : project.hasProperty('highFlatPlacementCheck') ? 'run-placement-priority-high' : 'run-placement-priority-thin') : file('run-port-checks')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('kurganHotfixCheck') ? 'slavicmyths_hotfix' : project.hasProperty('placementOverrideCheck') ? (project.hasProperty('waterFlatPlacementCheck') ? 'slavicmyths_water_placement' : project.hasProperty('terrainPlacementCheck') ? 'slavicmyths_terrain_placement' : project.hasProperty('sequentialPlacementCheck') ? 'slavicmyths_sequential_placement' : 'slavicmyths_placement') : project.hasProperty('naturalCoverageCheck') ? 'slavicmyths_coverage' : 'slavicmyths'
            systemProperty 'slavicmyths.portRoot', project.projectDir.absolutePath
        }
    }
}

if (project.hasProperty('portRuntimeCompanions')) {
    dependencies {
        runtimeOnly fileTree('.tools/test-pack-0.9.4') {
            include '*.jar'
            exclude 'curios-*.jar', 'jei-*.jar'
        }
    }
}

// Test-only high superflat preset, matching the reported save; never in production resources.
if (project.hasProperty('highFlatPlacementCheck')) { sourceSets.kurganCheck.resources.srcDir 'tools/manual-high-test-resources' }

if (project.hasProperty("waterFlatPlacementCheck")) {
    sourceSets.kurganCheck.resources.srcDir "tools/manual-water-test-resources"
}

// The isolated legacy harness also sees registry classes referenced by new native effects.
sourceSets.portCore.compileClasspath += sourceSets.main.output
tasks.named('compilePortCoreJava') { dependsOn 'classes' }

// Rare weapon fixtures remain outside all production outputs.
// Offline JVM checks: no Minecraft main, client, server, world, or mod-loader run.
if (project.hasProperty('runeReworkOfflineCheck')) {
    sourceSets { runeReworkOffline { java.srcDir 'tools/rune-rework-tests' } }
    sourceSets.runeReworkOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.runeReworkOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
