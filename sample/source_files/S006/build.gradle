 sourceSets { volkolakModelOffline { java.srcDir 'tools/volkolak-model-tests' } }
 sourceSets.volkolakModelOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
 sourceSets.volkolakModelOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 tasks.register('verifyVolkolakModel', JavaExec) {
