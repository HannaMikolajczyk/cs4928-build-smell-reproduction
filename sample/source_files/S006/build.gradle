        gameDirectory = file('run-combat-1344')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'slavicmyths_combat'
    } }
}
// Opt-in Tugarin tests; production JAR excludes fixtures.
if (project.hasProperty('tugarinRuntimeCheck')) {
