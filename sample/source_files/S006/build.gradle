    sourceSets.armorOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.armorOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    tasks.named('compileArmorOfflineJava') { dependsOn 'classes' }
    tasks.register('verifyArmorRunes', JavaExec) {
        dependsOn 'armorOfflineClasses'
        classpath = sourceSets.armorOffline.runtimeClasspath
        mainClass = 'org.slavicmyths.verify.ArmorRunesOffline'
        workingDir = file('.tools')
    }
}

if (project.hasProperty('rareRuntimeCheck')) {
    sourceSets { rareCheck { java.srcDir 'tools/rare-tests'; resources.srcDir 'tools/rare-test-resources' } }
    sourceSets.rareCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.rareCheck.runtimeClasspath += sourceSets.main.runtimeClasspath
