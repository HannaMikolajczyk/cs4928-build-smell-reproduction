        systemProperty 'neoforge.enabledGameTestNamespaces', 'slavicmyths_tugarin'
    } }
}
if (project.hasProperty('tugarinModelOfflineCheck')) {
    sourceSets { tugarinModelOffline { java.srcDir 'tools/tugarin-model-tests' } }
    sourceSets.tugarinModelOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.tugarinModelOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    tasks.register('verifyTugarinModels', JavaExec) {
        dependsOn 'tugarinModelOfflineClasses'
        classpath = sourceSets.tugarinModelOffline.runtimeClasspath
        mainClass = 'org.slavicmyths.verify.TugarinModelsOffline'
    }
}

// Isolated unique-equipment server fixtures; never included in production JARs.
if (project.hasProperty('uniqueEquipmentCheck')) {
    sourceSets { uniqueEquipmentCheck { java.srcDir 'tools/unique-equipment-tests'; resources.srcDir 'tools/unique-equipment-test-resources' } }
    sourceSets.uniqueEquipmentCheck.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
