    tasks.register('verifyRuneRework', JavaExec) {
        dependsOn 'runeReworkOfflineClasses'
        classpath = sourceSets.runeReworkOffline.runtimeClasspath
        mainClass = 'org.slavicmyths.verify.RuneReworkOffline'
    }
}
