    sourceSets.runeFoundationOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.runeFoundationOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    tasks.named('compileRuneFoundationOfflineJava') { dependsOn 'classes' }
    tasks.register('verifyRuneFoundation', JavaExec) {
        dependsOn 'runeFoundationOfflineClasses'
        classpath = sourceSets.runeFoundationOffline.runtimeClasspath
        mainClass = 'org.slavicmyths.verify.RuneFoundationOffline'
    }
}
if (project.hasProperty('armorOfflineCheck')) {
