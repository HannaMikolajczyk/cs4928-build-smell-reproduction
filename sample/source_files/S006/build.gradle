if (project.hasProperty('finistModelOfflineCheck')) {
 sourceSets { finistModelOffline { java.srcDir 'tools/finist-model-tests' } }
 sourceSets.finistModelOffline.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
 sourceSets.finistModelOffline.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
